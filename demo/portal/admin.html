<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232648d4%27/%3E%3C/svg%3E">
<title>Client Portal Demo · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Client portal. Layout: one centered work column under a quiet top bar; cards only where a
   block is its own object (a form, a request, the plan). Placeholder brand = cobalt accent. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #171a21;
  --muted: #5d6474;
  --line: #e1e4ea;
  --accent: #2648d4;
  --accent-ink: #ffffff;
  --accent-soft: #e8ecfd;
  --ok: #17794a;      --ok-soft: #e3f4ea;
  --warn: #9a5b06;    --warn-soft: #fbefd9;
  --bad: #b3261e;     --bad-soft: #fbe5e3;
  --info: #2648d4;    --info-soft: #e8ecfd;
  --shadow: 0 1px 2px rgba(23, 26, 33, 0.05);
  --radius: 10px;
  --font: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1116; --surface: #171a21; --ink: #e9ebf0; --muted: #9aa1b1; --line: #2a2f3a;
    --accent: #8ea4ff; --accent-ink: #0f1116; --accent-soft: #1f2744;
    --ok: #5fd197; --ok-soft: #13301f; --warn: #f0b25a; --warn-soft: #33260f;
    --bad: #ff8a80; --bad-soft: #3a1714; --info: #8ea4ff; --info-soft: #1f2744;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1116; --surface: #171a21; --ink: #e9ebf0; --muted: #9aa1b1; --line: #2a2f3a;
  --accent: #8ea4ff; --accent-ink: #0f1116; --accent-soft: #1f2744;
  --ok: #5fd197; --ok-soft: #13301f; --warn: #f0b25a; --warn-soft: #33260f;
  --bad: #ff8a80; --bad-soft: #3a1714; --info: #8ea4ff; --info-soft: #1f2744;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 400 15px/1.55 var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
h2, h3 { font-weight: 600; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

.wrap { width: min(1040px, 100%); margin-inline: auto; padding-inline: 16px; }
.main { padding-block: 28px 64px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }
.loading, .empty { color: var(--muted); padding-block: 8px; }

/* Top bar and tabs */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.02rem; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); box-shadow: inset -6px -6px 0 rgba(255, 255, 255, 0.25); }
.tag { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.who { color: var(--muted); font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { display: flex; gap: 8px; }
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 12px 12px 11px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* Page structure */
.page-head { margin-bottom: 20px; display: grid; gap: 4px; }
.section-title { font-size: 1rem; margin: 32px 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.narrow { max-width: 460px; margin: 40px auto; display: grid; gap: 12px; }
.card-title { font-size: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.grid .card { display: grid; gap: 6px; align-content: start; }
.label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.big { font-size: 1.35rem; font-weight: 600; overflow-wrap: anywhere; }
.big a { color: inherit; text-decoration: none; }
.snippet { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.link { font-weight: 600; text-decoration: none; margin-top: 4px; }
.link:hover { text-decoration: underline; }
.stack { display: grid; gap: 12px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 600; line-height: 1; padding: 5px 9px; border-radius: 999px; white-space: nowrap; vertical-align: middle; }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-muted { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

/* Buttons and forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn-quiet { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-quiet:hover { border-color: var(--muted); filter: none; }
.btn-small { padding: 6px 12px; font-size: 0.88rem; }
.form { display: grid; gap: 14px; }
.fields { display: grid; gap: 6px; min-width: 0; }
.fields label, legend { font-weight: 600; font-size: 0.9rem; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 16px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; }
fieldset { border: 0; display: grid; gap: 10px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.choice { position: relative; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; font-weight: 500; }
.choice input { width: auto; accent-color: var(--accent); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: auto; margin-top: 4px; accent-color: var(--accent); }
.hint { color: var(--muted); font-size: 0.85rem; }
.form-error { color: var(--bad); font-size: 0.9rem; }
.form-error:empty { display: none; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.notice { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.bad { background: var(--bad-soft); color: var(--bad); margin: 0; }

/* Billing */
.plan { display: grid; gap: 14px; max-width: 560px; }
.plan-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.price { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.price span { font-size: 1rem; font-weight: 500; color: var(--muted); }
.checks { list-style: none; display: grid; gap: 6px; }
.checks li::before { content: "✓"; color: var(--ok); font-weight: 700; margin-right: 8px; }

/* Requests */
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.ticket-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ticket-meta { color: var(--muted); font-size: 0.82rem; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ticket-title { font-size: 1.02rem; overflow-wrap: anywhere; }
.ticket-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 0.9rem; }
.facts dt { color: var(--muted); font-size: 0.78rem; }
.facts dd { font-weight: 600; font-variant-numeric: tabular-nums; }
.updates { list-style: none; display: grid; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; }
.update { white-space: pre-wrap; overflow-wrap: anywhere; }
.update-meta { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
.update-admin .update-meta { color: var(--accent); }
.reply { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.reply .btn { justify-self: start; }

/* Messages */
.chat { display: grid; gap: 16px; }
.thread { list-style: none; display: grid; gap: 10px; max-height: 60vh; overflow-y: auto; padding: 2px; }
.bubble { max-width: min(80%, 560px); padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.mine { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.bubble.theirs { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble-meta { font-size: 0.75rem; opacity: 0.75; margin-top: 4px; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.composer .form-error { grid-column: 1 / -1; }

/* Admin */
.admin-grid { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
.client-list { display: grid; gap: 12px; position: sticky; top: 80px; }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.list-head h1 { font-size: 1.25rem; }
.clients { list-style: none; display: grid; gap: 6px; }
.client-row { width: 100%; text-align: left; display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
.client-row:hover { border-color: var(--muted); }
.client-row.is-active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.client-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.client-sub { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.client-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.detail { display: grid; gap: 0; min-width: 0; }
.detail-head { display: grid; gap: 12px; }
.detail-title { font-size: 1.35rem; }
.detail-plan { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.empty-detail { text-align: center; padding-block: 48px; }
.fresh-link { display: grid; gap: 8px; background: var(--accent-soft); border-radius: 8px; padding: 12px; }
.copy { display: flex; gap: 8px; }
.copy-input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
.admin-reply .row { grid-template-columns: minmax(0, 220px); }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; padding: 10px 16px; border-radius: 8px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); max-width: calc(100vw - 32px); }
.toast-ok { background: var(--ink); color: var(--surface); }
.toast-warn { background: var(--warn-soft); color: var(--warn); }
.toast-bad { background: var(--bad); color: #fff; }

@media (max-width: 860px) {
  .admin-grid { grid-template-columns: 1fr; }
  .client-list { position: static; }
}
@media (max-width: 520px) {
  .main { padding-block: 20px 48px; }
  .card { padding: 16px; }
  .composer { grid-template-columns: 1fr; }
  .composer .btn { justify-self: end; }
  h1 { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* demo banner */
.demo-bar { background: var(--ink); color: var(--surface); font-size: 0.85rem; }
.demo-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 40px; padding-block: 6px; }
.demo-bar nav { display: flex; gap: 4px; }
.demo-bar a, .demo-bar button { color: var(--surface); background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; font-weight: 600; text-decoration: none; cursor: pointer; font-size: 0.85rem; }
.demo-bar a[aria-current="page"] { background: var(--surface); color: var(--ink); }
.demo-bar button { border-color: rgba(127,127,127,0.5); }
.topbar { top: 0; }

</style>
</head>
<body>
<div class="demo-bar"><div class="wrap"><span>Demo preview · sample data, nothing is sent or charged</span><nav aria-label="Demo views"><a href="index.html" >Client view</a><a href="admin.html" aria-current="page">Admin view</a><button type="button" onclick="resetPortalDemo()">Reset demo</button></nav></div></div>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <p class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="js-brand"></span> <span class="tag">Admin</span></p>
      <div class="topbar-actions" hidden>
        <button class="btn btn-quiet btn-small js-refresh" type="button">Refresh</button>
        <button class="btn btn-quiet btn-small js-signout" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <main class="wrap main" id="admin">
    <p class="loading">Loading…</p>
  </main>
  <script>try { sessionStorage.setItem("portal-admin-key", "demo-admin"); } catch {}</script>
<script>// Demo-only stand-in for the portal server: answers /api/portal/* from data kept in this browser.
(() => {
  const DB_KEY = "portal-demo-db";
  const iso = (daysAgo, h = 10) => { const d = new Date(); d.setDate(d.getDate() - daysAgo); d.setHours(h, 15, 0, 0); return d.toISOString(); };
  const seed = () => ({
    clients: {
      "gourmet-go": { id: "gourmet-go", name: "Gourmet Go", domain: "gourmetgo.com", email: "owner@gourmetgo.com", phone: "(555) 010-2000", createdAt: iso(30), subscription: null, unread: { tickets: 1, messages: 1 } },
      "corner-bar": { id: "corner-bar", name: "Corner Bar & Grill", domain: "cornerbargrill.com", email: "hello@cornerbargrill.com", phone: "", createdAt: iso(90), subscription: { status: "active", renewsAt: iso(-200), cancelAtPeriodEnd: false, customerId: "cus_demo2" }, unread: { tickets: 0, messages: 0 } },
    },
    tickets: {
      "gourmet-go": [
        { id: "t3", clientId: "gourmet-go", kind: "ads", status: "in_progress", priority: "normal", subject: "Google Ads: Start a new campaign", details: "Promote online ordering, especially weekends.", ads: { action: "start", goal: "orders", budget: 300, area: "10 miles around the restaurant" }, createdAt: iso(2), updatedAt: iso(1), updates: [{ by: "admin", text: "Campaign drafted. Going live tomorrow morning; we'll share the first numbers next week.", at: iso(1, 16) }] },
        { id: "t2", clientId: "gourmet-go", kind: "maintenance", status: "done", priority: "normal", subject: "Add Voodoo Fries photo", details: "New photo attached in messages.", ads: null, createdAt: iso(6), updatedAt: iso(5), updates: [{ by: "admin", text: "Added to the menu section. Looks great!", at: iso(5, 14) }] },
      ],
      "corner-bar": [
        { id: "t1", clientId: "corner-bar", kind: "support", status: "open", priority: "urgent", subject: "Menu prices not updating", details: "Happy hour prices still show the old ones.", ads: null, createdAt: iso(0, 9), updatedAt: iso(0, 9), updates: [] },
      ],
    },
    messages: {
      "gourmet-go": [
        { id: "m1", from: "admin", text: "Welcome to your client portal! Send requests and messages here any time.", at: iso(7, 11) },
        { id: "m2", from: "client", text: "Thanks! Can we run a promo for the Double GoBurger next month?", at: iso(0, 12) },
      ],
      "corner-bar": [],
    },
  });
  let db;
  try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch {}
  db ??= seed();
  const save = () => { try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch {} };
  window.resetPortalDemo = () => { try { localStorage.removeItem(DB_KEY); localStorage.removeItem("portal-key"); sessionStorage.removeItem("portal-admin-key"); } catch {} location.reload(); };

  const ACTIONS = { start: "Start a new campaign", change: "Change budget or targeting", pause: "Pause ads", resume: "Resume ads", stop: "Stop ads for good" };
  const KINDS = ["support", "maintenance"];
  const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const now = () => new Date().toISOString();
  const ok = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { "content-type": "application/json" } });
  const err = (status, error) => ok({ error }, status);
  const bump = (c, f) => { c.unread = { tickets: 0, messages: 0, ...c.unread }; c.unread[f]++; };
  const notice = (text) => {
    const n = document.createElement("div");
    n.className = "toast toast-ok"; n.setAttribute("role", "status"); n.textContent = text;
    document.body.append(n); setTimeout(() => n.remove(), 4500);
  };

  function handle(method, path, body, auth) {
    try { db = JSON.parse(localStorage.getItem(DB_KEY)) ?? db; } catch {} // pick up changes made in the other view
    const parts = path.split("/").filter(Boolean);
    if (parts[0] === "admin") {
      if (auth !== "demo-admin") return err(401, "Wrong admin key.");
      const [, section, cid, sub] = parts;
      if (method === "GET" && section === "clients" && !cid) {
        return ok({ clients: Object.values(db.clients).map((c) => ({ ...c, openRequests: (db.tickets[c.id] ?? []).filter((t) => t.status !== "done").length })) });
      }
      if (method === "POST" && section === "clients" && !cid) {
        if (!body.name?.trim()) return err(400, "Enter the client's business name.");
        const c = { id: id(), name: body.name.trim(), domain: body.domain ?? "", email: body.email ?? "", phone: body.phone ?? "", createdAt: now(), subscription: null, unread: { tickets: 0, messages: 0 } };
        db.clients[c.id] = c; db.tickets[c.id] = []; db.messages[c.id] = []; save();
        return ok({ client: c, link: `https://your-site.netlify.app/portal/?k=demo-${c.id}` }, 201);
      }
      if (section === "clients" && cid) {
        const c = db.clients[cid];
        if (!c) return err(404, "Client not found.");
        if (method === "GET") { c.unread = { tickets: 0, messages: 0 }; save(); return ok({ client: c, tickets: db.tickets[cid] ?? [], messages: db.messages[cid] ?? [] }); }
        if (method === "POST" && sub === "link") return ok({ link: `https://your-site.netlify.app/portal/?k=demo-${id()}` });
      }
      if (method === "POST" && section === "tickets") {
        const t = (db.tickets[cid] ?? []).find((x) => x.id === sub);
        if (!t) return err(404, "Request not found.");
        if (body.status) t.status = body.status;
        if (body.reply?.trim()) t.updates.push({ by: "admin", text: body.reply.trim(), at: now() });
        t.updatedAt = now(); save();
        return ok({ ticket: t });
      }
      if (method === "POST" && section === "messages") {
        if (!body.text?.trim()) return err(400, "Write a message first.");
        const m = { id: id(), from: "admin", text: body.text.trim(), at: now() };
        (db.messages[cid] ??= []).push(m); save();
        return ok({ message: m }, 201);
      }
      return err(404, "Not found.");
    }

    const c = db.clients["gourmet-go"];
    if (!auth) return err(401, "This portal link isn't valid anymore. Ask us for a new one.");
    const route = `${method} ${parts.join("/")}`;
    if (route === "GET me") return ok({ client: c, tickets: db.tickets[c.id] ?? [], messages: db.messages[c.id] ?? [], billingEnabled: true });
    if (route === "POST tickets") {
      const t = { id: id(), clientId: c.id, kind: body.kind, status: "open", priority: body.priority === "urgent" ? "urgent" : "normal", subject: "", details: (body.details ?? "").trim(), ads: null, createdAt: now(), updatedAt: now(), updates: [] };
      if (body.kind === "ads") {
        const a = body.ads ?? {};
        if (!ACTIONS[a.action]) return err(400, "Choose what you'd like to do with your ads.");
        const budget = a.budget === "" || a.budget == null ? null : Number(a.budget);
        if (a.action === "start" && !a.goal) return err(400, "Choose a goal for the campaign.");
        if (a.action === "start" && budget === null) return err(400, "Enter a monthly budget for the campaign.");
        if (budget !== null && !(budget >= 1 && budget <= 100000)) return err(400, "Enter a monthly budget between $1 and $100,000.");
        t.ads = { action: a.action, goal: a.goal || null, budget, area: (a.area ?? "").trim() };
        t.subject = `Google Ads: ${ACTIONS[a.action]}`;
      } else if (KINDS.includes(body.kind)) {
        t.subject = (body.subject ?? "").trim();
        if (!t.subject) return err(400, "Add a short subject.");
        if (!t.details) return err(400, "Describe what you need.");
      } else return err(400, "Choose a request type.");
      (db.tickets[c.id] ??= []).unshift(t); bump(c, "tickets"); save();
      return ok({ ticket: t }, 201);
    }
    if (method === "POST" && parts[0] === "tickets" && parts[2] === "reply") {
      const t = db.tickets[c.id].find((x) => x.id === parts[1]);
      if (!t) return err(404, "Request not found.");
      if (!body.text?.trim()) return err(400, "Write a reply first.");
      t.updates.push({ by: "client", text: body.text.trim(), at: now() });
      if (t.status === "done") t.status = "open";
      bump(c, "tickets"); save();
      return ok({ ticket: t });
    }
    if (route === "POST messages") {
      if (!body.text?.trim()) return err(400, "Write a message first.");
      const m = { id: id(), from: "client", text: body.text.trim(), at: now() };
      db.messages[c.id].push(m); bump(c, "messages"); save();
      return ok({ message: m }, 201);
    }
    if (route === "POST billing/checkout") {
      const renews = new Date(); renews.setFullYear(renews.getFullYear() + 1);
      c.subscription = { status: "active", renewsAt: renews.toISOString(), cancelAtPeriodEnd: false, customerId: "cus_demo" }; save();
      notice("Demo: Stripe's secure checkout would open here. We've marked the plan as paid.");
      setTimeout(() => location.reload(), 1500);
      return ok({ url: "#billing" });
    }
    if (route === "POST billing/manage") {
      notice("Demo: Stripe's billing page would open here (update card, receipts, cancel).");
      return ok({ url: "#billing" });
    }
    return err(404, "Not found.");
  }

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const url = typeof input === "string" ? input : input.url;
    const m = url.match(/\/api\/portal\/(.*)$/);
    if (!m) return realFetch(input, init);
    await new Promise((r) => setTimeout(r, 250));
    const auth = (init.headers?.authorization ?? "").replace(/^Bearer\s+/, "");
    let body = {};
    try { body = init.body ? JSON.parse(init.body) : {}; } catch {}
    return handle((init.method ?? "GET").toUpperCase(), m[1], body, auth);
  };
})();
</script>
<script type="module">
// Client portal settings, shared by the portal pages and the portal server functions.
// TODO: replace the placeholder brand with your business name.
const PORTAL = {
  brand: "Your Studio",
  plan: {
    name: "Website & Domain Care",
    price: 100, // US dollars per year
    // TODO: list exactly what the yearly fee covers.
    includes: ["Domain renewal", "Hosting and security updates", "Small text and photo updates"],
  },
  // Request types clients can choose on the Support tab.
  requestKinds: {
    support: "Support (something isn't working)",
    maintenance: "Maintenance (update or change something)",
  },
  ads: {
    actions: {
      start: "Start a new campaign",
      change: "Change budget or targeting",
      pause: "Pause ads",
      resume: "Resume ads",
      stop: "Stop ads for good",
    },
    goals: {
      calls: "More phone calls",
      visits: "More website visits",
      orders: "More online orders",
      store: "More people in the store",
    },
  },
};

// Shared helpers for the client portal and admin pages.

// h("p", { class: "x", onclick }, "text", child) builds DOM safely (strings become text, never HTML).
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

async function api(path, { key, method = "GET", body } = {}) {
  const res = await fetch(`/api/portal/${path}`, {
    method,
    headers: { authorization: `Bearer ${key}`, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Something went wrong. Please try again."), { status: res.status });
  return data;
}

const fmtDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const fmtDateTime = (iso) =>
  iso ? new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const money = (n) => `$${Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;

const STATUS = { open: ["Open", "info"], in_progress: ["In progress", "warn"], done: ["Done", "ok"] };
const statusPill = (s) => h("span", { class: `pill pill-${STATUS[s]?.[1] ?? "muted"}` }, STATUS[s]?.[0] ?? s);

function planState(sub) {
  const s = sub?.status;
  if (s === "active" || s === "trialing") {
    return sub.cancelAtPeriodEnd
      ? { label: "Ends " + fmtDate(sub.renewsAt), tone: "warn", active: true }
      : { label: "Active", tone: "ok", active: true };
  }
  if (s === "past_due" || s === "unpaid") return { label: "Payment failed", tone: "bad", active: true };
  if (s === "canceled") return { label: "Canceled", tone: "muted", active: false };
  if (s === "incomplete") return { label: "Payment pending", tone: "warn", active: false };
  return { label: "Not paid", tone: "muted", active: false };
}
const planPill = (sub) => {
  const p = planState(sub);
  return h("span", { class: `pill pill-${p.tone}` }, p.label);
};

const kindLabel = (t) =>
  t.kind === "ads" ? "Google Ads" : t.kind === "maintenance" ? "Maintenance" : "Support";

// One request card with its history and an optional footer (reply form / admin controls).
function ticketCard(t, { footer, viewer = "client" } = {}) {
  const facts = [];
  if (t.ads) {
    if (t.ads.goal) facts.push(["Goal", PORTAL.ads.goals[t.ads.goal]]);
    if (t.ads.budget != null) facts.push(["Monthly budget", money(t.ads.budget)]);
    if (t.ads.area) facts.push(["Area", t.ads.area]);
  }
  const who = (by) => (by === viewer ? "You" : by === "admin" ? PORTAL.brand : "Client");
  return h("article", { class: "ticket" },
    h("header", { class: "ticket-head" },
      h("div", {},
        h("p", { class: "ticket-meta" }, kindLabel(t), " · ", fmtDate(t.createdAt), t.priority === "urgent" ? h("span", { class: "pill pill-bad" }, "Urgent") : null),
        h("h3", { class: "ticket-title" }, t.subject)),
      statusPill(t.status)),
    facts.length ? h("dl", { class: "facts" }, facts.map(([k, v]) => h("div", {}, h("dt", {}, k), h("dd", {}, v)))) : null,
    t.details ? h("p", { class: "ticket-body" }, t.details) : null,
    t.updates?.length
      ? h("ol", { class: "updates" }, t.updates.map((u) =>
          h("li", { class: `update update-${u.by}` },
            h("p", { class: "update-meta" }, who(u.by), " · ", fmtDateTime(u.at)),
            h("p", {}, u.text))))
      : null,
    footer ?? null);
}

function messageThread(messages, viewer) {
  if (!messages.length) return h("p", { class: "empty" }, "No messages yet.");
  return h("ol", { class: "thread" }, messages.map((m) =>
    h("li", { class: `bubble ${m.from === viewer ? "mine" : "theirs"}` },
      h("p", {}, m.text),
      h("p", { class: "bubble-meta" }, m.from === viewer ? "You" : m.from === "admin" ? PORTAL.brand : "Client", " · ", fmtDateTime(m.at)))));
}

function toast(text, tone = "ok") {
  const t = h("div", { class: `toast toast-${tone}`, role: "status" }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), 4000);
}

// Disable a form's submit button while `work` runs and show any error inside the form.
async function submitting(form, work) {
  const btn = form.querySelector("[type=submit]");
  const err = form.querySelector(".form-error");
  if (err) err.textContent = "";
  btn && (btn.disabled = true);
  try {
    await work();
  } catch (e) {
    if (err) err.textContent = e.message;
    else toast(e.message, "bad");
  } finally {
    btn && (btn.disabled = false);
  }
}

// Admin side of the portal: add clients, share their private links, answer requests and messages.

const KEY_STORE = "portal-admin-key";
const root = document.getElementById("admin");
const actions = document.querySelector(".topbar-actions");
document.querySelectorAll(".js-brand").forEach((el) => (el.textContent = PORTAL.brand));
document.title = `${PORTAL.brand} · Portal Admin`;

let key = "";
try { key = sessionStorage.getItem(KEY_STORE) || ""; } catch {}
let clients = [];
let selected = null; // { client, tickets, messages }
let freshLink = null; // { clientId, link } shown once after creating a client or resetting a link
let adding = false;

const call = (path, opts = {}) => api(`admin/${path}`, { key, ...opts });

function signIn(message = "") {
  actions.hidden = true;
  const form = h("form", { class: "card narrow form" },
    h("h1", {}, "Portal admin"),
    h("p", { class: "muted" }, "Enter the admin key you set as PORTAL_ADMIN_KEY on Netlify."),
    h("div", { class: "fields" },
      h("label", { for: "admin-key" }, "Admin key"),
      h("input", { id: "admin-key", type: "password", autocomplete: "current-password", required: true })),
    h("p", { class: "form-error", role: "alert" }, message),
    h("button", { class: "btn", type: "submit" }, "Sign in"));
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submitting(form, async () => {
      key = form.querySelector("#admin-key").value.trim();
      await loadClients();
      try { sessionStorage.setItem(KEY_STORE, key); } catch {}
      render();
    });
  });
  root.replaceChildren(form);
}

async function loadClients() {
  clients = (await call("clients")).clients;
}
async function openClient(id) {
  selected = await call(`clients/${id}`);
  const row = clients.find((c) => c.id === id);
  if (row) row.unread = { tickets: 0, messages: 0 };
  render();
  if (matchMedia("(max-width: 860px)").matches) root.querySelector(".detail")?.scrollIntoView({ behavior: "smooth" });
}

function copyBox(link) {
  const input = h("input", { class: "copy-input", value: link, readonly: true, "aria-label": "Portal link" });
  const btn = h("button", { class: "btn btn-small", type: "button" }, "Copy");
  btn.addEventListener("click", () => {
    navigator.clipboard?.writeText(link).then(
      () => toast("Link copied."),
      () => { input.select(); toast("Press Ctrl+C / ⌘C to copy.", "warn"); });
  });
  return h("div", { class: "copy" }, input, btn);
}

function clientList() {
  const add = h("form", { class: "card form add-client", hidden: !adding },
    h("h2", { class: "card-title" }, "Add a client"),
    ...[["name", "Business name", "text", true], ["domain", "Website domain", "text"], ["email", "Billing email", "email"], ["phone", "Phone", "tel"]].map(([n, l, t, req]) =>
      h("div", { class: "fields" }, h("label", { for: `new-${n}` }, l), h("input", { id: `new-${n}`, name: n, type: t, required: req, maxlength: "120" }))),
    h("p", { class: "form-error", role: "alert" }),
    h("div", { class: "actions" },
      h("button", { class: "btn", type: "submit" }, "Create client"),
      h("button", { class: "btn btn-quiet", type: "button", onclick: () => { adding = false; render(); } }, "Cancel")));
  add.addEventListener("submit", (e) => {
    e.preventDefault();
    submitting(add, async () => {
      const body = Object.fromEntries(new FormData(add));
      const { client, link } = await call("clients", { method: "POST", body });
      adding = false;
      freshLink = { clientId: client.id, link };
      await loadClients();
      await openClient(client.id);
    });
  });

  return h("aside", { class: "client-list" },
    h("div", { class: "list-head" },
      h("h1", {}, "Clients"),
      h("button", { class: "btn btn-small", type: "button", hidden: adding, onclick: () => { adding = true; render(); root.querySelector("#new-name")?.focus(); } }, "Add client")),
    add,
    clients.length
      ? h("ul", { class: "clients" }, clients.map((c) => {
          const unread = (c.unread?.tickets ?? 0) + (c.unread?.messages ?? 0);
          return h("li", {},
            h("button", { type: "button", class: `client-row${selected?.client.id === c.id ? " is-active" : ""}`, onclick: () => openClient(c.id).catch((e) => toast(e.message, "bad")) },
              h("span", { class: "client-name" }, c.name, unread ? h("span", { class: "dot", "aria-label": `${unread} new` }) : null),
              h("span", { class: "client-sub" }, c.domain || "No domain"),
              h("span", { class: "client-badges" }, planPill(c.subscription), c.openRequests ? h("span", { class: "pill pill-info" }, `${c.openRequests} open`) : null)));
        }))
      : h("p", { class: "empty" }, "No clients yet. Add your first one."));
}

function adminControls(t, clientId) {
  const sid = `status-${t.id}`, rid = `reply-${t.id}`;
  const form = h("form", { class: "reply admin-reply" },
    h("div", { class: "row" },
      h("div", { class: "fields" },
        h("label", { for: sid }, "Status"),
        h("select", { id: sid, name: "status" }, [["open", "Open"], ["in_progress", "In progress"], ["done", "Done"]].map(([v, l]) => h("option", { value: v, selected: t.status === v }, l))))),
    h("div", { class: "fields" },
      h("label", { for: rid }, "Reply to client (optional)"),
      h("textarea", { id: rid, name: "reply", rows: "2", maxlength: "4000" })),
    h("p", { class: "form-error", role: "alert" }),
    h("button", { class: "btn btn-small", type: "submit" }, "Save"));
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submitting(form, async () => {
      const { ticket } = await call(`tickets/${clientId}/${t.id}`, { method: "POST", body: { status: form.status.value, reply: form.reply.value } });
      selected.tickets = selected.tickets.map((x) => (x.id === ticket.id ? ticket : x));
      const row = clients.find((c) => c.id === clientId);
      if (row) row.openRequests = selected.tickets.filter((x) => x.status !== "done").length;
      toast("Saved.");
      render();
    });
  });
  return form;
}

function detail() {
  if (!selected) return h("section", { class: "detail card empty-detail" }, h("p", { class: "muted" }, "Choose a client to see their requests, messages and billing."));
  const { client: c, tickets, messages } = selected;

  let confirmReset = false;
  const resetBtn = h("button", { class: "btn btn-quiet btn-small", type: "button" }, "New portal link");
  resetBtn.addEventListener("click", async () => {
    if (!confirmReset) {
      confirmReset = true;
      resetBtn.textContent = "Confirm: old link stops working";
      return;
    }
    resetBtn.disabled = true;
    try {
      freshLink = { clientId: c.id, link: (await call(`clients/${c.id}/link`, { method: "POST" })).link };
      render();
    } catch (e) {
      toast(e.message, "bad");
      resetBtn.disabled = false;
    }
  });

  const msgForm = h("form", { class: "composer" },
    h("label", { class: "sr-only", for: "admin-msg" }, "Message"),
    h("textarea", { id: "admin-msg", name: "text", rows: "2", maxlength: "2000", placeholder: `Message ${c.name}…` }),
    h("button", { class: "btn", type: "submit" }, "Send"),
    h("p", { class: "form-error", role: "alert" }));
  msgForm.addEventListener("submit", (e) => {
    e.preventDefault();
    submitting(msgForm, async () => {
      const { message } = await call(`messages/${c.id}`, { method: "POST", body: { text: msgForm.text.value } });
      selected.messages.push(message);
      msgForm.text.value = "";
      render();
    });
  });

  const sub = c.subscription;
  return h("section", { class: "detail" },
    h("header", { class: "card detail-head" },
      h("div", {},
        h("h2", { class: "detail-title" }, c.name),
        h("p", { class: "muted" }, [c.domain, c.email, c.phone].filter(Boolean).join(" · ") || "No contact details")),
      h("div", { class: "detail-plan" },
        planPill(sub),
        sub?.renewsAt ? h("span", { class: "muted small" }, `${sub.cancelAtPeriodEnd ? "Ends" : "Renews"} ${fmtDate(sub.renewsAt)}`) : null),
      freshLink?.clientId === c.id
        ? h("div", { class: "fresh-link" },
            h("p", {}, h("strong", {}, "Portal link for ", c.name), ". Send it to the client privately; anyone with it can open their portal."),
            copyBox(freshLink.link))
        : h("div", { class: "actions" }, resetBtn)),
    h("h3", { class: "section-title" }, "Requests"),
    tickets.length
      ? h("div", { class: "stack" }, tickets.map((t) => ticketCard(t, { viewer: "admin", footer: adminControls(t, c.id) })))
      : h("p", { class: "empty" }, "No requests yet."),
    h("h3", { class: "section-title" }, "Messages"),
    h("section", { class: "card chat" }, messageThread(messages, "admin"), msgForm));
}

function render() {
  actions.hidden = false;
  root.replaceChildren(h("div", { class: "admin-grid" }, clientList(), detail()));
}

document.querySelector(".js-signout").addEventListener("click", () => {
  try { sessionStorage.removeItem(KEY_STORE); } catch {}
  key = "";
  selected = null;
  signIn();
});
document.querySelector(".js-refresh").addEventListener("click", async () => {
  try {
    await loadClients();
    if (selected) selected = await call(`clients/${selected.client.id}`);
    freshLink = null;
    render();
    toast("Up to date.");
  } catch (e) {
    toast(e.message, "bad");
  }
});

if (!key) signIn();
else loadClients().then(render, (e) => signIn(e.status === 401 ? "That admin key didn't work." : e.message));

</script>

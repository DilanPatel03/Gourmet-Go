<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Online — Gourmet Go</title>
  <meta name="description" content="Order Gourmet Go online for pickup: smash burgers, crispy chicken and loaded fries.">
  <meta name="theme-color" content="#0a0907">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Manrope:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="order-page">
  <header class="site-header">
    <div class="container nav">
      <a href="./" class="brand" aria-label="Gourmet Go home">
        <img src="images/logo.svg" alt="" width="34" height="34">
        <span class="brand-word">Gourmet Go</span>
      </a>
      <a href="./" class="back-link"><span aria-hidden="true">←</span> Home</a>
      <button class="cart-btn js-cart-open" type="button" aria-controls="cart-panel" aria-label="Your order, 0 items">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1 13h-11zM9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count js-cart-count" hidden>0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="order-intro">
      <div class="container">
        <p class="eyebrow eyebrow-rule">Order online</p>
        <h1 class="metal">Build your order.</h1>
        <p class="lead">Add what you're craving, then check out securely. Pickup is ready in about <span class="js-ready">20</span> minutes.</p>
        <p class="small muted">Prefer delivery? <a class="text-link js-doordash" href="https://www.doordash.com/store/44671789" target="_blank" rel="noopener">Order on DoorDash <span aria-hidden="true">→</span></a></p>
      </div>
    </section>

    <nav class="order-cats" aria-label="Menu categories">
      <div class="container order-cats-inner" id="order-cats"></div>
    </nav>

    <section class="section order-menu">
      <div class="container" id="order-menu"></div>
    </section>
  </main>

  <div class="order-bar" hidden>
    <button type="button" class="order-bar-btn js-cart-open">
      <span class="order-bar-count"><span class="js-bar-count">0 items</span><span class="order-bar-sep" aria-hidden="true">·</span>View order</span>
      <strong class="js-bar-total">$0.00</strong>
    </button>
  </div>

  <footer class="site-footer">
    <div class="hairline" aria-hidden="true"></div>
    <div class="container footer-inner">
      <a href="./" class="brand">
        <img src="images/logo.svg" alt="" width="28" height="28">
        <span class="brand-word">Gourmet Go</span>
      </a>
      <p class="small">Prices before tax. &copy; <span id="year"></span> Gourmet Go</p>
    </div>
  </footer>

  <script type="module" src="order.js"></script>
  <script type="module" src="cart.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>
